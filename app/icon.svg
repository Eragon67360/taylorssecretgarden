<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The garden's mark (components/garden-mark.tsx), a pressed daisy on a scrap of journal paper. -->
  <rect width="40" height="40" rx="9" fill="#f3eadb"/>
  <g transform="translate(20 20) scale(.9) translate(-20 -20)" fill="#7e2a37" fill-opacity=".8">
    <ellipse cx="20" cy="10" rx="4.5" ry="9"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(45 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(90 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(135 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(180 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(225 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(270 20 20)"/>
    <ellipse cx="20" cy="10" rx="4.5" ry="9" transform="rotate(315 20 20)"/>
  </g>
  <circle cx="20" cy="20" r="4.5" fill="#E9B949"/>
</svg>
