name: CI

# Two jobs on every pull request, each on its own
# production build under `next start`, unless only documentation changed
# (see the `changes` job):
#   smoke       lint and formatting, typecheck, unit and integration tests,
#               build, then the Playwright smoke suite
#   lighthouse  build, then Lighthouse CI (lighthouserc.js): mobile, median of
#               3 runs; Accessibility under 0.9 fails, Performance under 0.9 warns
#
# Each job runs on its own Neon branch (database + Neon Auth, docs/adr/0004),
# created from production for the run, migrated and seeded, and deleted at the
# end (it also expires after two hours, should the deletion not run); see
# .github/actions/neon-branch. The production branch itself is never written
# to: the tests that sign up or publish refuse to run on it (e2e/member.ts).
#
# Required repository settings (values are never committed):
#   secrets.NEON_API_KEY             Neon API key (project-scoped), creates and deletes the branches
#   vars.NEON_PROJECT_ID             the Neon project
#   secrets.NEON_AUTH_COOKIE_SECRET  signs Neon Auth's session cookies (32+ characters); given
#                                    only to the steps that run the app or its write guard

# Pull requests only. Every change reaches dev through a pull request this
# already tested, and the release pull request (dev → main) tests dev again.
# A run on pushes to dev as well tested the same commit twice, and cancelling
# one of the two (to stay under Neon's branch cap) left `cancelled` smoke and
# lighthouse checks on the release's head, which main's ruleset counts as
# failed (#144).
on:
  pull_request:

# The GITHUB_TOKEN only reads the repository: the jobs talk to Neon with their
# own key and upload artifacts, neither of which needs a write permission.
permissions:
  contents: read

# One run at a time per pull request branch, the newest push winning: an
# outdated run would only hold two Neon branches for nothing. A fork's branch
# of the same name gets a group of its own, so it cannot cancel ours.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Builds and serves the development styleguide (/styleguide) for its tests;
  # production (Vercel) leaves it unset and answers 404.
  ENABLE_STYLEGUIDE: 1
  # AI moderation of Posts in its fake mode (service/moderation.ts): marker
  # words decide, no AI Gateway call, so CI is fast, free and deterministic.
  SWIFTTER_MODERATION: fake

jobs:
  # Whether anything besides documentation changed: Markdown files, docs/,
  # LICENSE, .vscode/ and dependabot.yml neither build nor run. A pull request
  # is compared with its base (from where they part).
  # When only documentation changed, smoke and lighthouse are skipped (no Neon
  # branch, no build) and, skipped, still count as passed for the required
  # checks. Anything uncertain (a failed diff, this job failing) runs both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # both ends of the comparison and where they part
          filter: blob:none # file names only: no need for the old contents

      - name: Anything besides documentation?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "::warning::Could not compare $HEAD with $BASE: running every check"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(printf '%s\n' "$files" | grep -Ev '(^|/)[^/]*\.md$|^docs/|^LICENSE$|^\.vscode/|^\.github/dependabot\.yml$' | grep -c . || true)
          echo "$code file(s) besides documentation changed"
          if [ "$code" -gt 0 ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    # Runs unless the changes job said "documentation only" (so also when it failed).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # reads `engines.node`
          cache: npm

      - run: npm ci

      - name: A Neon branch for this run
        id: branch
        uses: ./.github/actions/neon-branch
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/${{ github.run_id }}-${{ github.run_attempt }}-smoke
          cookie_secret: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test # hermetic: moderation runs against the AI SDK's mock model

      - name: Integration tests
        env:
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }} # the write guard wants it
        run: npm run test:integration # the Swiftter service against this run's Neon branch

      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # A new key whenever the lockfile or a source changes; restoring the
          # closest older one still saves most of the work.
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.mjs', '**/*.css', '!node_modules/**', '!.next/**', '!portfolio-hover/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build # Neon Auth is set up on first use, not at build time (lib/auth/server.ts)

      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        # From the cache when it hit; the system libraries are installed either way.
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        env:
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }} # signs the app's session cookies
        run: npm run test:e2e # the Playwright web server runs `next start` on the build above

      - name: Flaky tests
        # Counts in the run summary, and a warning per test that passed only on its retry.
        if: always() && hashFiles('playwright-results.json') != ''
        run: npx tsx scripts/playwright-summary.ts

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: ./.github/actions/neon-branch/delete
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.branch.outputs.branch_id }}

  lighthouse:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: A Neon branch for this run
        id: branch
        uses: ./.github/actions/neon-branch
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/${{ github.run_id }}-${{ github.run_attempt }}-lighthouse
          cookie_secret: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # A new key whenever the lockfile or a source changes; restoring the
          # closest older one still saves most of the work.
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.mjs', '**/*.css', '!node_modules/**', '!.next/**', '!portfolio-hover/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        env:
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }} # signs the app's session cookies
        run: npm run lighthouse # starts `next start` itself (lighthouserc.js); uses the runner's Chrome

      - name: Scores
        if: always() && hashFiles('.lighthouseci/reports/manifest.json') != ''
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: ./.github/actions/neon-branch/delete
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.branch.outputs.branch_id }}
