name: CI

# Two jobs on every pull request and on pushes to dev, each on its own
# production build under `next start`:
#   smoke       lint, typecheck, build, then the Playwright smoke suite
#   lighthouse  build, then Lighthouse CI (lighthouserc.js): mobile, median of
#               3 runs; Accessibility under 0.9 fails, Performance under 0.9 warns
#
# Each job runs on its own Neon branch (database + Neon Auth, docs/adr/0004),
# created from production for the run, migrated and seeded, and deleted at the
# end (it also expires after two hours, should the deletion not run). The
# production branch itself is never written to: the tests that sign up or
# publish refuse to run on it (e2e/member.ts).
#
# Required repository settings (values are never committed):
#   secrets.NEON_API_KEY             Neon API key (project-scoped), creates and deletes the branches
#   vars.NEON_PROJECT_ID             the Neon project
#   secrets.NEON_AUTH_COOKIE_SECRET  signs Neon Auth's session cookies (32+ characters)

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
  # Builds and serves the development styleguide (/styleguide) for its tests;
  # production (Vercel) leaves it unset and answers 404.
  ENABLE_STYLEGUIDE: 1
  # AI moderation of Posts in its fake mode (service/moderation.ts): marker
  # words decide, no AI Gateway call, so CI is fast, free and deterministic.
  SWIFTTER_MODERATION: fake

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # reads `engines.node`
          cache: npm

      - run: npm ci

      - name: Branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create a Neon branch for this run
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/${{ github.run_id }}-${{ github.run_attempt }}-smoke
          expires_at: ${{ steps.expiry.outputs.at }}
          get_auth_url: true

      - name: Point the app at the branch
        env:
          DB_URL: ${{ steps.branch.outputs.db_url_pooled }}
          AUTH_URL: ${{ steps.branch.outputs.auth_url }}
        run: |
          test -n "$AUTH_URL" || { echo "::error::Neon Auth is not enabled on the CI branch"; exit 1; }
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "NEON_AUTH_BASE_URL=$AUTH_URL" >> "$GITHUB_ENV"

      - name: Migrate and seed the branch
        run: npm run db:migrate && npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test # hermetic: moderation runs against the AI SDK's mock model

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e # the Playwright web server runs `next start` on the build above

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        # One API call; Neon's delete-branch-action still runs setup-node on Node 20.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: >-
          curl --fail-with-body -sS -o /dev/null -X DELETE -H "Authorization: Bearer $NEON_API_KEY"
          "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID"

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create a Neon branch for this run
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/${{ github.run_id }}-${{ github.run_attempt }}-lighthouse
          expires_at: ${{ steps.expiry.outputs.at }}
          get_auth_url: true

      - name: Point the app at the branch
        env:
          DB_URL: ${{ steps.branch.outputs.db_url_pooled }}
          AUTH_URL: ${{ steps.branch.outputs.auth_url }}
        run: |
          test -n "$AUTH_URL" || { echo "::error::Neon Auth is not enabled on the CI branch"; exit 1; }
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "NEON_AUTH_BASE_URL=$AUTH_URL" >> "$GITHUB_ENV"

      - name: Migrate and seed the branch
        run: npm run db:migrate && npm run db:seed

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run lighthouse # starts `next start` itself (lighthouserc.js); uses the runner's Chrome

      - name: Scores
        if: always() && hashFiles('.lighthouseci/reports/manifest.json') != ''
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

      - name: Delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        # One API call; Neon's delete-branch-action still runs setup-node on Node 20.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: >-
          curl --fail-with-body -sS -o /dev/null -X DELETE -H "Authorization: Bearer $NEON_API_KEY"
          "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID"
